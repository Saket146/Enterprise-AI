version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL - Primary Transactional Database
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: enterprise_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_ai_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount schema files so they can be initialized automatically on empty databases
      - ./infrastructure/postgres/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Qdrant - Vector Similarity Search Database
  # ----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. Neo4j - Enterprise Knowledge Graph Database
  # ----------------------------------------------------
  neo4j:
    image: neo4j:5.12-community
    container_name: enterprise_neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP UI Dashboard
      - "7687:7687" # Bolt Driver Port
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------
  # 4. Redis - High-speed caching & Session manager
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 5. FastAPI Backend Application Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: enterprise_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # 6. React Frontend Application Service
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend/frontend
    container_name: enterprise_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_import:
  neo4j_logs:
  redis_data:
